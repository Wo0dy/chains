name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: chain validate rules
      - run: chain test rules
      - run: chain fuzz rules --min-recall 0.9
      - run: chain replay rules examples/labeled_events.jsonl --baseline examples/baseline_events.jsonl --min-precision 0.9 --min-recall 0.9 --out replay-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: replay-report-py${{ matrix.python }}
          path: replay-report.json
      - run: pytest -q
  corpus:
    # Sync the pinned SigmaHQ commit and keep the report: this is the fidelity dashboard over time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: chain sources sync
      - run: chain sources status
      - run: python -c "from chain import Engine; e = Engine.from_paths(['corpus/sigmahq', 'corpus/signature-base']); print(len(e.rules), 'rules load')"
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-reports
          path: corpus/*/report.json
