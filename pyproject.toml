[project]
name = "chain-detect"
version = "0.1.0"
description = "Chain: semantic, context-aware detection rules for classic and agentic SecOps"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3", "faiss-cpu>=1.8"]
yara = ["yara-python>=4.5"]
dev = ["pytest>=8", "yara-python>=4.5"]   # yara-python: differential tests against the reference engine

[project.scripts]
chain = "chain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chain*"]
